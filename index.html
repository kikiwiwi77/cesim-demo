 const sales=allocateMarket(utility,avail,marketSize);let outcomes=[];
 for(let i=0;i<c.length;i++){const co=c[i],d=decisions[i],sold=sales[i],made=produced[i],cost=unitCosts[i],prevDebt=co.debt;const rev=sold*d.price/10000,prodCost=made*cost/10000,avgCost=(co.inventoryBook+prodCost)/Math.max(.000001,co.inventory+made);const cogs=sold*avgCost,invCount=Math.max(0,co.inventory+made-sold),invBook=invCount*avgCost;
 const holding=invCount*16/10000;const fixed=245+Math.max(0,co.capacity-32000)*.0016;const depreciation=Math.max(30,co.plant*.018);const interest=prevDebt*.015;const expense=d.marketing+d.research+d.quality+fixed+depreciation+holding;const opProfit=rev-cogs-expense;const profit=opProfit-interest;const invest=d.expand;const cashBeforeFunding=co.cash+rev-prodCost-(expense-depreciation)-interest-invest+d.finance;
 const financeDebt=prevDebt+d.finance;const emergencyLoan=Math.max(0,-cashBeforeFunding);const endCash=cashBeforeFunding+emergencyLoan;const endDebt=financeDebt+emergencyLoan;const share=sold/marketSize;
 co.cash=endCash;co.debt=endDebt;co.plant=Math.max(0,co.plant+invest-depreciation);co.capacity+=Math.round(invest/400)*6000;co.inventory=invCount;co.inventoryBook=invBook;co.tech=bounded(co.tech+.053*Math.log1p(d.research/240)-.004,.65,1.9);co.brand=bounded(co.brand+.042*(share-.25)+.02*(d.marketing/200-1)+.013*(d.quality/110-1),.58,1.5);co.cumulativeProfit+=profit;co.lastProfit=profit;co.lastRevenue=rev;co.lastShare=share;

 }

 return {round,event:e.name,marketSize,outcomes,companies:c,totalSales:sales.reduce((a,b)=>a+b,0)};
}

function updatePreview(){const box=document.getElementById('preview');if(box)box.innerHTML=previewBox();}
function updateField(key,value){const m=DECISION_META[key];if(!m)return;let max=key==='production'?Math.min(m.max,Math.floor(currentPlayer().capacity/1000)):m.max;let min=key==='finance'?-Math.min(500,Math.floor(currentPlayer().debt/50)*50):m.min;let n=Number(value);if(!Number.isFinite(n))n=0;n=bounded(Math.round(n/m.step)*m.step,min,max);S.decisions[key]=n;const number=document.querySelector(`[data-number="${key}"]`),slider=document.querySelector(`[data-slider="${key}"]`);if(number)number.value=n;if(slider){slider.value=n;slider.style.setProperty('--range',`${(n-min)/(max-min)*100}%`);}persist();updatePreview();}
function notify(text){document.querySelector('.toast')?.remove();const node=document.createElement('div');node.className='toast';node.textContent=text;document.body.appendChild(node);setTimeout(()=>node.remove(),3200)}
function showResult(round){const p=round.outcomes[0],done=completed();const ov=document.createElement('div');ov.id='result-modal';ov.className='modal-backdrop';ov.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-icon">✓</div><h2 id="modal-title">第 ${round.round} 轮结算完成</h2><p>所有企业决策已执行，市场需求和经营财务结果已结算。${done?'八轮经营模拟已正式结束。':'可以分析结果，也可以继续开展下一轮。'}</p><div class="modal-grid"><div class="modal-tile"><small>本轮净利润</small><strong>${fmt(p.profit,0)} 万</strong></div><div class="modal-tile"><small>市场份额</small><strong>${fmt(p.share*100,1)}%</strong></div><div class="modal-tile"><small>当前排名</small><strong>第 ${p.rank} 名</strong></div></div>${done?`<div class="final-banner">最终累计净利润：${fmt(p.cumulativeProfit,0)} 万元 · 最终排名第 ${p.rank} 名</div>`:''}<div class="modal-actions" style="margin-top:23px"><button class="btn btn-ghost" data-action="modal-report">查看本轮报表</button><button class="btn btn-primary" data-action="modal-next">${done?'查看竞争排名':'继续下一轮'} ${ic('arrow',15)}</button></div></div>`;document.body.appendChild(ov);}
function submit(){if(completed())return;S.decisions=normalizedDecision(S.decisions,currentPlayer());const result=calculateRound(S.companies,S.decisions,S.round);S.companies=result.companies;S.history.push({round:result.round,event:result.event,marketSize:result.marketSize,totalSales:result.totalSales,outcomes:result.outcomes});S.reportRound=S.round;S.round++;if(!completed()){const p=currentPlayer();const next=defaultDecision(p);S.decisions={...next,price:S.decisions.price,marketing:S.decisions.marketing,research:S.decisions.research,quality:S.decisions.quality};}persist();render();showResult(result);}
function download(text,file,type){const blob=new Blob(['\ufeff',text],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=file;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function csv(){if(!S.history.length){notify('尚未完成任何轮次，暂无报表可导出');return;}const headers=['轮次','企业','战略定位','排名','产品价格(元)','生产量(台)','销量(台)','市场份额(%)','营业收入(万元)','销售成本(万元)','营销费用(万元)','研发费用(万元)','质量投入(万元)','运营利润(万元)','净利润(万元)','累计净利润(万元)','期末现金(万元)','有息负债(万元)','所有者权益(万元)','期末库存(台)','下一轮产能(台)'];const rows=S.history.flatMap(r=>r.outcomes.map(o=>[r.round,o.name,o.tag,o.rank,o.decision.price,o.production,o.sales,(o.share*100).toFixed(2),o.revenue.toFixed(2),o.cogs.toFixed(2),o.marketing,o.research,o.quality,o.opProfit.toFixed(2),o.profit.toFixed(2),o.cumulativeProfit.toFixed(2),o.cash.toFixed(2),o.debt.toFixed(2),o.equity.toFixed(2),o.inventory,o.capacity]));const escape=x=>`"${String(x).replaceAll('"','""')}"`;download([headers,...rows].map(r=>r.map(escape).join(',')).join('\r\n'),'NEXUS_SIM_经营报表.csv','text/csv;charset=utf-8');notify('经营报表已导出');}
function closeModal(){document.getElementById('result-modal')?.remove();}
document.addEventListener('click',e=>{const nav=e.target.closest('[data-nav]');if(nav){S.tab=nav.dataset.nav;S.menuOpen=false;render();window.scrollTo({top:0,behavior:'smooth'});return;}const metric=e.target.closest('[data-metric]');if(metric){S.chartMetric=metric.dataset.metric;render();return;}const action=e.target.closest('[data-action]');if(!action)return;const op=action.dataset.action;if(op==='menu'){S.menuOpen=true;render();}else if(op==='close-menu'){S.menuOpen=false;render();}else if(op==='submit'){submit();}else if(op==='reset'){if(window.confirm('确定重新开始吗？当前 8 轮进度及历史决策将被清空，此操作不可撤销。')){S=initState();closeModal();render();notify('经营模拟已重置');}}else if(op==='modal-report'){closeModal();S.tab='reports';render();window.scrollTo(0,0);}else if(op==='modal-next'){closeModal();S.tab=completed()?'ranking':'overview';render();window.scrollTo(0,0);}else if(op==='export-csv'){csv();}else if(op==='export-json'){download(JSON.stringify({exportedAt:new Date().toISOString(),simulation:S},null,2),'NEXUS_SIM_模拟存档.json','application/json;charset=utf-8');notify('当前模拟存档已导出');}});
document.addEventListener('input',e=>{if(e.target.matches('[data-slider]'))updateField(e.target.dataset.slider,e.target.value);});
document.addEventListener('change',e=>{if(e.target.matches('[data-number]'))updateField(e.target.dataset.number,e.target.value);if(e.target.id==='report-select'){S.reportRound=Number(e.target.value);render();}});
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.menuOpen){S.menuOpen=false;render();}if(e.key==='Escape')closeModal();});
render();
})();
</script>
</body>
</html>
